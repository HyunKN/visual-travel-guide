<text x="312.5" y="1340" text-anchor="middle" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="30" font-weight="400" fill="#20384b">안내</text>
<line x1="475.0" y1="1384" x2="150.0" y2="1384" stroke="#20384b" stroke-width="2" stroke-dasharray="8 6"/>
