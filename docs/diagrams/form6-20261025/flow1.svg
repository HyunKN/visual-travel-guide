<text x="1125.0" y="994" text-anchor="middle" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="30" font-weight="400" fill="#20384b">설명·출처 / 자료 없음</text>
<line x1="1450.0" y1="1038" x2="800.0" y2="1038" stroke="#20384b" stroke-width="2" stroke-dasharray="8 6"/>
<polygon points="800.0,1038 812.0,1032 812.0,1044" fill="#20384b"/>
