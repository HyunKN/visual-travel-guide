<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1586" viewBox="0 0 1600 1586">
<rect width="100%" height="100%" fill="white"/>
<text x="55" y="30" text-anchor="start" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="36" font-weight="700" fill="#20384b">핵심 흐름 1 · 앱 실행에서 첫 설명까지</text>
<text x="55" y="88" text-anchor="start" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#667b8b">사진 인식과 준비된 예시를 구분하고, 같은 대상의 설명·출처로 연결합니다.</text>
