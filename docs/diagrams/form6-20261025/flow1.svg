<rect x="65" y="1419" width="1470" height="57" fill="#f1f5f7" stroke="#d7e0e6" stroke-width="1"/>
<text x="88" y="1430" text-anchor="start" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#20384b">유효 요청만 적용. 예시는 모델 호출 없음. 미확정·오류는 흐름 2.</text>
<text x="55" y="1538" text-anchor="start" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#667b8b">구현 전 설계 · 실선: 요청/행동 · 점선: 결과/안내</text>
</svg>