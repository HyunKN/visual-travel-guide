name: Build unsigned iPhone IPA

on:
  workflow_dispatch:
  # Bootstrap the first run before GitHub registers workflow_dispatch on main.
  push:
    branches: [codex/ios-free-device-testing]
    paths: ['.github/workflows/ios-unsigned.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: mobile
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies and generate iOS project
        run: |
          node --version
          xcodebuild -version
          pod --version
          npm ci
          npx --no-install expo prebuild --platform ios --no-install
          pod install --project-directory=ios
      - name: Compile unsigned Release for iPhone
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          auth_config=disabled
          if [[ -n "$EXPO_PUBLIC_SUPABASE_URL" || -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]]; then
            if [[ ! "$EXPO_PUBLIC_SUPABASE_URL" =~ ^https://[a-z0-9-]+\.supabase\.co/?$ ||
                  ! "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" =~ ^sb_publishable_[a-zA-Z0-9_-]+$ ]]; then
              echo "::error::Set the Supabase project URL variable and publishable key secret together, or leave both unset."
              exit 1
            fi
            auth_config=enabled
          fi

          workspaces=(ios/*.xcworkspace)
          if [[ ${#workspaces[@]} -ne 1 || ! -d "${workspaces[0]}" ]]; then
            echo "::error::Expected a single generated iOS workspace."
            exit 1
          fi
          workspace="${workspaces[0]}"
          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/nubi-ios" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build
          echo "Supabase configuration: $auth_config" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify device build and package IPA
        run: |
          apps=("$RUNNER_TEMP"/nubi-ios/Build/Products/Release-iphoneos/*.app)
          if [[ ${#apps[@]} -ne 1 || ! -d "${apps[0]}" ]]; then
            echo "::error::Expected a single Release-iphoneos app."
            exit 1
          fi
          app="${apps[0]}"
          plist="$app/Info.plist"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          expected_id="$(node -p 'require("./app.json").expo.ios.bundleIdentifier')"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          minimum_ios="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist")"
          [[ "$bundle_id" == "$expected_id" ]]
          [[ "$(xcrun lipo -archs "$app/$executable")" == arm64 ]]
          xcrun vtool -show-build "$app/$executable" | grep -Eiq '^[[:space:]]*platform[[:space:]]+IOS[[:space:]]*$'
          test -s "$app/main.jsbundle"
          test ! -e "$app/embedded.mobileprovision"

          package_dir="$RUNNER_TEMP/nubi-package"
          mkdir -p "$package_dir/Payload"
          ditto "$app" "$package_dir/Payload/$(basename "$app")"
          ditto -c -k --keepParent "$package_dir/Payload" "$RUNNER_TEMP/Nubi-unsigned.ipa"
          unzip -tq "$RUNNER_TEMP/Nubi-unsigned.ipa"
          {
            echo "Commit: `$GITHUB_SHA`"
            echo "Bundle ID: `$bundle_id`"
            echo "Device architecture: `arm64`"
            echo "Minimum iOS: `$minimum_ios`"
            echo 'IPA SHA-256:'
            shasum -a 256 "$RUNNER_TEMP/Nubi-unsigned.ipa"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nubi-iphone-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/Nubi-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
