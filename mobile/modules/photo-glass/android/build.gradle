plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.photoglass'
version = '1.0.0'

android {
  namespace 'expo.modules.photoglass'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  // Package the existing three registered JPEGs; do not copy source assets.
  sourceSets.main.assets.srcDirs += file('../../../assets/places')
}
