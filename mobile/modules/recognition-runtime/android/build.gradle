plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.nubirecognition'
version = '1.0.0'

android {
  namespace 'expo.modules.nubirecognition'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.3'
}
